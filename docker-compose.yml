# One-command run for TasteBridge:  docker compose up --build  (or: docker-compose up --build)
# Teammates: add the frontend and pipeline services below.
services:
  backend:
    build: ./src/backend
    ports:
      - "9000:9000"
    environment:
      ARTIFACT_DIR: /app/sample_artifacts
      CORS_ORIGINS: "*"
    volumes:
      - feedback:/app/feedback   # keeps votes across restarts and rebuilds
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Offline evaluation (Min-Recall@10, NDCG@10, coverage). Runs once and exits.
  #   mkdir -p src/evaluation/results
  #   docker compose --profile evaluation run --rm evaluation
  # Defaults to synthetic data; see src/evaluation/README.md for real data.
  evaluation:
    build: ./src/evaluation
    profiles: ["evaluation"]
    environment:
      GIT_COMMIT: ${GIT_COMMIT:-}
    volumes:
      - ./src/evaluation/results:/app/results
      - ./src/evaluation/data:/app/data:ro

volumes:
  feedback:
