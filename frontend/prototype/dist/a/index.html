:root{

/* Feedback follows book selection, evidence exploration and a shared decision. */
:root{

}
.primary:active:not(:disabled),.secondary:active:not(:disabled),
.sample-button:active:not(:disabled),.pair-next:active:not(:disabled),
.desk-vote-options button:active:not(:disabled),.detail-pagination button:active:not(:disabled),
.galaxy-controls button:active:not(:disabled){transform:translateY(1px)}
.primary:focus-visible,.pair-next:focus-visible,.desk-vote-options button.chosen:focus-visible{
 outline-color:var(--pine);box-shadow:0 0 0 2px var(--paper);
}
.reader-tabs button,.filter-list button{

.reader-tabs button.active:after,.reader-tabs button[aria-pressed="true"]:after,

#catalogue-feedback:empty,.handoff-note:empty{display:none}

/* A jacket lifts for inspection and rests in a distinct selected state. */
.book-object{transition:transform var(--settle) var(--motion-ease),box-shadow var(--settle),outline-color var(--quick)}
.book-pick.is-picked .book-object,.book-pick[aria-pressed="true"] .book-object{

}
.book-pick:focus-visible{border-radius:2px}
.book-pick:focus-visible .book-object{transform:translateY(-4px)}
.book-pick:active .book-object{transform:translateY(-1px) scale(.985)}
.book-pick.just-added .book-object{animation:book-place 340ms var(--motion-ease)}
.book-pick.just-removed .book-object{animation:book-release 250ms var(--motion-ease)}
.book-check{transition:background-color var(--quick),box-shadow var(--quick)}
.book-pick.is-picked .book-pick-note,.book-pick[aria-pressed="true"] .book-pick-note{color:var(--pine);font-weight:500}
.reader-summary{padding-bottom:1.65rem}
.seed-slot .book-object{transition:transform 220ms var(--motion-ease),box-shadow 220ms}
.seed-slot:focus-within .book-object{transform:translateY(-3px)}

.slot-remove{

 width:44px;height:44px;min-width:44px;min-height:44px;padding:0;
 border:0;background:none;box-shadow:none;opacity:1;outline-offset:2px;
}

 box-shadow:0 2px 5px #163c3218;transition:background-color var(--quick),border-color var(--quick);

}
@keyframes book-release{

}
